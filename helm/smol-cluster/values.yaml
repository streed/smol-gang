# -- Global settings
nameOverride: ""
fullnameOverride: ""

# -- Namespace to deploy into
namespace: smol-cluster

# -- Gateway configuration
gateway:
  image:
    repository: smol-cluster/gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  env:
    logLevel: info
    k8sNamespace: smol-cluster
  # -- Additional environment variables (key-value pairs)
  extraEnv: {}

# -- PostgreSQL configuration
postgresql:
  # -- Use embedded StatefulSet (set to false if using external DB)
  embedded: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  port: 5432
  database: smol_cluster
  username: smol_cluster
  # -- Password for embedded PostgreSQL (set via secret in production)
  password: ""
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # -- External database URL (used when embedded is false)
  externalDatabaseURL: ""

# -- Agent pod defaults
agent:
  image:
    repository: smol-cluster/agent
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# -- Web UI configuration
web:
  image:
    repository: smol-cluster/web
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  service:
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: smol-cluster.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: smol-cluster-tls
    #   hosts:
    #     - smol-cluster.local

# -- RBAC configuration
rbac:
  create: true
  # -- Use ClusterRole (true) or namespace-scoped Role (false)
  clusterScoped: true

# -- ServiceAccount configuration
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Secrets (provide via --set or external secret manager)
secrets:
  jwtSecret: ""
  databasePassword: ""
  githubAppID: ""
  githubAppPrivateKey: ""
  githubWebhookSecret: ""
  slackBotToken: ""
  slackSigningSecret: ""
  llmApiKey: ""

# -- Slack integration
slack:
  enabled: false
  # -- Bot token and signing secret are provided via secrets above

# -- LLM configuration defaults
llm:
  apiURL: "https://api.anthropic.com"
  model: "claude-sonnet-4-20250514"

# -- NetworkPolicy
networkPolicy:
  enabled: true

# -- Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# -- Grafana configuration
grafana:
  enabled: true
  adminPassword: "admin"
  service:
    port: 3000

# -- Prometheus configuration
prometheus:
  enabled: true

# -- Loki configuration
loki:
  enabled: true

# -- Promtail configuration
promtail:
  enabled: true

# -- Image pull secrets
imagePullSecrets: []
