apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smol-cluster.gateway.fullname" . }}
  namespace: {{ include "smol-cluster.namespace" . }}
  labels:
    {{- include "smol-cluster.gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "smol-cluster.gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "smol-cluster.gateway.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/gateway-secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "smol-cluster.serviceAccountName" . }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "smol-cluster.gateway.fullname" . }}-config
            - secretRef:
                name: {{ include "smol-cluster.gateway.fullname" . }}-secret
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "smol-cluster.gateway.fullname" . }}-secret
                  key: DATABASE_PASSWORD
            - name: DATABASE_URL
              value: {{ include "smol-cluster.databaseURL" . | quote }}
            {{- range $key, $value := .Values.gateway.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
