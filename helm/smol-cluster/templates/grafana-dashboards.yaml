apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "smol-cluster.fullname" . }}-grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smol-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  workstream-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Active Workstreams",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 10 },
                  { "color": "red", "value": 50 }
                ]
              }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area", "justifyMode": "auto", "textMode": "auto" },
          "targets": [
            {
              "expr": "smol_workstreams_active",
              "legendFormat": "Active",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Workstreams by Status",
          "type": "piechart",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "pieType": "pie", "tooltip": { "mode": "single" }, "legend": { "displayMode": "list", "placement": "right" } },
          "targets": [
            {
              "expr": "sum by (status) (smol_workstreams_total)",
              "legendFormat": "{{ status }}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Workstream Creation Rate",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 20, "pointSize": 5 },
              "unit": "ops"
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "single" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum(rate(smol_workstreams_total[5m]))",
              "legendFormat": "Creation Rate",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Pod Provision Duration",
          "type": "histogram",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "fillOpacity": 80 }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "single" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(smol_pod_provision_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(smol_pod_provision_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(smol_pod_provision_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ]
        },
        {
          "title": "Messages per Workstream (Top 10)",
          "type": "barchart",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "fillOpacity": 80 },
              "unit": "short"
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "single" }, "legend": { "displayMode": "list", "placement": "bottom" }, "orientation": "horizontal", "xTickLabelRotation": 0 },
          "targets": [
            {
              "expr": "topk(10, sum by (workstream_id) (smol_agent_messages_total))",
              "legendFormat": "{{ workstream_id }}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["smol-cluster"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "Prometheus", "value": "Prometheus" },
            "hide": 0,
            "includeAll": false,
            "name": "DS_PROMETHEUS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "title": "Workstream Overview",
      "uid": "smol-workstream-overview"
    }
  agent-logs.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Agent Logs for Workstream",
          "type": "logs",
          "gridPos": { "h": 14, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "options": { "showTime": true, "showLabels": true, "showCommonLabels": false, "wrapLogMessage": true, "prettifyLogMessage": false, "enableLogDetails": true, "sortOrder": "Descending", "dedupStrategy": "none" },
          "targets": [
            {
              "expr": "{app=\"smol-agent\", workstream_id=~\"$workstream_id\"}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Error Rate by Workstream",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 20 },
              "unit": "ops",
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum by (workstream_id) (rate({app=\"smol-agent\"} |= \"ERROR\" [5m]))",
              "legendFormat": "{{ workstream_id }}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "All Agent Logs",
          "type": "table",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 14 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "options": { "showHeader": true, "footer": { "show": false } },
          "targets": [
            {
              "expr": "{app=\"smol-agent\"} | json | line_format \"{{.message}}\"",
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "extractFields",
              "options": { "source": "labels" }
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["smol-cluster", "logs"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "Loki", "value": "Loki" },
            "hide": 0,
            "includeAll": false,
            "name": "DS_LOKI",
            "options": [],
            "query": "loki",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "allValue": ".*",
            "current": {},
            "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
            "definition": "label_values({app=\"smol-agent\"}, workstream_id)",
            "hide": 0,
            "includeAll": true,
            "label": "Workstream ID",
            "multi": false,
            "name": "workstream_id",
            "options": [],
            "query": "label_values({app=\"smol-agent\"}, workstream_id)",
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "title": "Agent Logs",
      "uid": "smol-agent-logs"
    }
  api-performance.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Request Rate by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 10 },
              "unit": "reqps",
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] } },
          "targets": [
            {
              "expr": "sum by (path) (rate(smol_http_requests_total[5m]))",
              "legendFormat": "{{ path }}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Request Latency (p50 / p95 / p99)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 10 },
              "unit": "s",
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(smol_http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(smol_http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(smol_http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ]
        },
        {
          "title": "Error Rate (4xx / 5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 20 },
              "unit": "reqps",
              "color": { "mode": "palette-classic" }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "4xx" }, "properties": [{ "id": "color", "value": { "fixedColor": "yellow", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "5xx" }, "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }] }
            ]
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum(rate(smol_http_requests_total{status=~\"4..\"}[5m]))",
              "legendFormat": "4xx",
              "refId": "A"
            },
            {
              "expr": "sum(rate(smol_http_requests_total{status=~\"5..\"}[5m]))",
              "legendFormat": "5xx",
              "refId": "B"
            }
          ]
        },
        {
          "title": "Active WebSocket Connections",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 20 },
              "unit": "short",
              "color": { "fixedColor": "blue", "mode": "fixed" }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "single" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "smol_workstreams_active",
              "legendFormat": "Active Connections",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["smol-cluster", "api"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "Prometheus", "value": "Prometheus" },
            "hide": 0,
            "includeAll": false,
            "name": "DS_PROMETHEUS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "title": "API Performance",
      "uid": "smol-api-performance"
    }
  llm-usage.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "LLM Request Rate by Model",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 20 },
              "unit": "reqps",
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max", "sum"] } },
          "targets": [
            {
              "expr": "sum by (model) (rate(smol_llm_requests_total[5m]))",
              "legendFormat": "{{ model }}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "LLM Latency by Model",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 10 },
              "unit": "s",
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] } },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (model, le) (rate(smol_llm_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{ model }} p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (model, le) (rate(smol_llm_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{ model }} p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (model, le) (rate(smol_llm_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{ model }} p99",
              "refId": "C"
            }
          ]
        },
        {
          "title": "LLM Error Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "bars", "fillOpacity": 60 },
              "unit": "reqps",
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "sum"] } },
          "targets": [
            {
              "expr": "sum by (model, status) (rate(smol_llm_requests_total{status!=\"success\"}[5m]))",
              "legendFormat": "{{ model }} - {{ status }}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["smol-cluster", "llm"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "Prometheus", "value": "Prometheus" },
            "hide": 0,
            "includeAll": false,
            "name": "DS_PROMETHEUS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "title": "LLM Usage",
      "uid": "smol-llm-usage"
    }
