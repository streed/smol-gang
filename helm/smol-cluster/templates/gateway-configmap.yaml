apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "smol-cluster.gateway.fullname" . }}-config
  namespace: {{ include "smol-cluster.namespace" . }}
  labels:
    {{- include "smol-cluster.gateway.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.gateway.port | quote }}
  LOG_LEVEL: {{ .Values.gateway.env.logLevel | quote }}
  K8S_NAMESPACE: {{ .Values.gateway.env.k8sNamespace | quote }}
  AGENT_IMAGE: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
  LLM_API_URL: {{ .Values.llm.apiURL | quote }}
  LLM_MODEL: {{ .Values.llm.model | quote }}
  {{- if .Values.postgresql.embedded }}
  POSTGRES_HOST: {{ include "smol-cluster.postgresql.fullname" . | quote }}
  POSTGRES_PORT: {{ .Values.postgresql.port | quote }}
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.username | quote }}
  {{- end }}
