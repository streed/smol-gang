apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "smol-cluster.fullname" . }}-grafana-datasources
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smol-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "smol-cluster.fullname" . }}-prometheus:9090
        isDefault: true
        editable: false
      - name: Loki
        type: loki
        access: proxy
        url: http://{{ include "smol-cluster.fullname" . }}-loki:3100
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "smol-cluster.fullname" . }}-grafana-dashboard-provisioning
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smol-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: smol-cluster
        orgId: 1
        folder: "smol-cluster"
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smol-cluster.fullname" . }}-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smol-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "smol-cluster.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "smol-cluster.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "smol-cluster.fullname" . }}-grafana-secret
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SERVER_HTTP_PORT
              value: "3000"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
            - name: data
              mountPath: /var/lib/grafana
            - name: dashboards
              mountPath: /etc/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: {{ include "smol-cluster.fullname" . }}-grafana-datasources
        - name: dashboard-provisioning
          configMap:
            name: {{ include "smol-cluster.fullname" . }}-grafana-dashboard-provisioning
        - name: dashboards
          configMap:
            name: {{ include "smol-cluster.fullname" . }}-grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "smol-cluster.fullname" . }}-grafana-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "smol-cluster.fullname" . }}-grafana-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smol-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smol-cluster.fullname" . }}-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smol-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.grafana.service.port | default 3000 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "smol-cluster.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smol-cluster.fullname" . }}-grafana-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smol-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
type: Opaque
data:
  admin-password: {{ .Values.grafana.adminPassword | default "admin" | b64enc | quote }}
