apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smol-gang.gateway.fullname" . }}-secret
  namespace: {{ include "smol-gang.namespace" . }}
  labels:
    {{- include "smol-gang.gateway.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  DATABASE_PASSWORD: {{ (default .Values.postgresql.password .Values.secrets.databasePassword) | b64enc | quote }}
  {{- if .Values.secrets.githubAppID }}
  GITHUB_APP_ID: {{ .Values.secrets.githubAppID | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.githubAppPrivateKey }}
  GITHUB_APP_PRIVATE_KEY: {{ .Values.secrets.githubAppPrivateKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.githubWebhookSecret }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.githubWebhookSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.llmApiKey }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.slack.enabled }}
  SLACK_BOT_TOKEN: {{ .Values.secrets.slackBotToken | b64enc | quote }}
  SLACK_SIGNING_SECRET: {{ .Values.secrets.slackSigningSecret | b64enc | quote }}
  {{- end }}
