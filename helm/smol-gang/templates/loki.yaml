apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "smol-gang.fullname" . }}-loki-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smol-gang.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 168h
      allow_structured_metadata: true
      volume_enabled: true

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      delete_request_store: filesystem

    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smol-gang.fullname" . }}-loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smol-gang.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "smol-gang.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: loki
  template:
    metadata:
      labels:
        {{- include "smol-gang.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: loki
      annotations:
        checksum/config: {{ toYaml .Values.observability | sha256sum }}
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.0
          args:
            - "-config.file=/etc/loki/loki.yaml"
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: {{ include "smol-gang.fullname" . }}-loki-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "smol-gang.fullname" . }}-loki-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "smol-gang.fullname" . }}-loki-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smol-gang.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smol-gang.fullname" . }}-loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smol-gang.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3100
      targetPort: http
      protocol: TCP
  selector:
    {{- include "smol-gang.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: loki
