version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smol_cluster
      POSTGRES_USER: smol
      POSTGRES_PASSWORD: smol_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smol -d smol_cluster"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://smol:smol_dev_password@postgres:5432/smol_cluster?sslmode=disable"
      PORT: "8080"
      JWT_SECRET: "dev-jwt-secret-change-in-production"
      K8S_NAMESPACE: "smol-cluster"
      K8S_IN_CLUSTER: "false"
      LLM_API_URL: "${LLM_API_URL:-http://host.docker.internal:11434/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-llama3}"
      AGENT_IMAGE: "smol-cluster/agent:latest"
      LOG_LEVEL: "debug"
      ADMIN_EMAIL: "admin@localhost"
      ADMIN_PASSWORD: "admin"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "${HOME}/.kube:/root/.kube:ro"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: "http://localhost:8080"
      VITE_WS_URL: "ws://localhost:8080"
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/index.html:/app/index.html
    depends_on:
      - gateway

volumes:
  postgres_data:
