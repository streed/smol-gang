version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smol_gang
      POSTGRES_USER: smol
      POSTGRES_PASSWORD: smol_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smol -d smol_gang"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    network_mode: host
    environment:
      DATABASE_URL: "postgres://smol:smol_dev_password@localhost:5432/smol_gang?sslmode=disable"
      PORT: "8080"
      JWT_SECRET: "dev-jwt-secret-change-in-production"
      K8S_NAMESPACE: "smol-gang"
      K8S_IN_CLUSTER: "false"
      LLM_API_URL: "${LLM_API_URL:-http://localhost:11434/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-llama3}"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama-api}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
      FRONTEND_URL: "http://localhost:3000"
      AGENT_IMAGE: "smol-gang/agent:latest"
      LOG_LEVEL: "debug"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "${HOME}/.kube:/root/.kube:ro"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_URL: "http://localhost:8080/api/v1"
        VITE_WS_URL: "ws://localhost:8080"
        VITE_GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  postgres_data:
